# herdr-plugin.toml — herdr-native install of the cheat-sheet auto-open.
# On each new session, open an "info" workspace with the keybindings cheat sheet.
# This replaces the optional shell-rc wrapper (install.sh --hook): no ~/.bashrc edit.
id = "herdr-emacs"
name = "herdr-emacs"
version = "0.1.0"
description = "Opinionated emacs-keymap companion: auto-opens an info workspace with the keybindings cheat sheet on each new herdr session."
min_herdr_version = "0.7.0"
platforms = ["linux", "macos"]

[[events]]
on = "session.created"
command = ["bash", "ensure-info.sh"]
